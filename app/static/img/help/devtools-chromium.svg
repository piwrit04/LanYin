<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Edge / Chrome 网络面板示意图</title>
  <desc id="d">在开发者工具顶部打开「网络」，选中一条发往音乐网站的请求，到右侧「标头」的「请求标头」里复制 Cookie。图中数值已打码。</desc>
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="640" height="300" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="640" height="300" fill="#1c1e22"/>
    <!-- tab bar -->
    <rect width="640" height="36" fill="#14161a"/>
    <text x="16" y="23" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#8b9098">元素</text>
    <text x="56" y="23" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#8b9098">控制台</text>
    <text x="108" y="23" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#8b9098">来源</text>
    <rect x="148" y="8" width="52" height="20" rx="4" fill="#2a4a6e"/>
    <text x="157" y="23" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#8ec8ff">网络</text>
    <text x="210" y="23" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#8b9098">应用程序</text>
    <rect x="276" y="8" width="28" height="20" rx="4" fill="#2a2d33"/>
    <text x="282" y="23" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#c5c9d0">&gt;&gt;</text>
    <line x1="148" y1="35" x2="200" y2="35" stroke="#5aa2e8" stroke-width="2"/>
    <!-- filter -->
    <rect x="0" y="36" width="640" height="28" fill="#191b1f"/>
    <text x="16" y="54" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#6d737c">筛选：名称 / 状态</text>
    <!-- split -->
    <rect x="0" y="64" width="250" height="236" fill="#16181c"/>
    <text x="16" y="84" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#6d737c">名称</text>
    <text x="188" y="84" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#6d737c">状态</text>
    <text x="16" y="108" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="12" fill="#a8adb6">music.163.com</text>
    <text x="198" y="108" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#6d737c">200</text>
    <!-- selected row -->
    <rect x="8" y="116" width="234" height="22" rx="3" fill="#1e3a5f"/>
    <text x="16" y="132" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="12" fill="#e8eaed">api/song/enhance/player</text>
    <text x="198" y="132" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#9ad0ff">200</text>
    <text x="16" y="156" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="12" fill="#8b9098">static/style.css</text>
    <text x="198" y="156" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#6d737c">200</text>
    <text x="16" y="178" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="12" fill="#8b9098">hm.gif</text>
    <text x="198" y="178" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#6d737c">204</text>
    <line x1="250" y1="64" x2="250" y2="300" stroke="#2c3036"/>
    <!-- right pane tabs -->
    <rect x="250" y="64" width="390" height="236" fill="#1c1e22"/>
    <text x="266" y="86" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#e8eaed">标头</text>
    <text x="308" y="86" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#8b9098">预览</text>
    <text x="348" y="86" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#8b9098">响应</text>
    <line x1="266" y1="90" x2="290" y2="90" stroke="#5aa2e8" stroke-width="2"/>
    <text x="266" y="116" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#9aa0a8">常规</text>
    <text x="266" y="136" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#8b9098">请求网址  https://music.163.com/…</text>
    <text x="266" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#9aa0a8">请求标头</text>
    <!-- cookie row highlight -->
    <rect x="260" y="170" width="280" height="36" rx="4" fill="#2a2416" stroke="#c9a227" stroke-width="1.2"/>
    <text x="270" y="186" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="12" fill="#f3d26a">Cookie</text>
    <text x="270" y="202" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="12" fill="#e8eaed">MUSIC_U=…</text>
    <text x="266" y="226" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#8b9098">Accept  */*</text>
    <text x="266" y="244" font-family="Segoe UI, Consolas, Microsoft YaHei, monospace" font-size="11" fill="#8b9098">Referer  https://music.163.com/</text>
    <!-- callout -->
    <path d="M548 188 H572" stroke="#f3d26a" stroke-width="1.4"/>
    <polygon points="548,188 555,184 555,192" fill="#f3d26a"/>
    <rect x="572" y="174" width="56" height="28" rx="4" fill="#f3d26a"/>
    <text x="580" y="192" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#1c1e22">复制这里</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="299" rx="12" fill="none" stroke="#3a3e46"/>
</svg>
