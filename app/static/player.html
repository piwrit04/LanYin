<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>澜音播放器</title>
  <link rel="stylesheet" href="/static/css/common.css?v=31" />
  <link rel="stylesheet" href="/static/css/player.css?v=31" />
</head>
<body>
  <div class="box">
    <div class="cover-stage vinyl">
      <div class="vinyl-disc">
        <div class="cover" id="cover"></div>
      </div>
    </div>
    <h1 id="title">播放器已就绪</h1>
    <p class="meta" id="meta">把本页作为 OBS 浏览器源添加，并勾选「控制音频」；或在本机浏览器打开本页取声。</p>
    <div class="bar"><span id="bar"></span></div>
    <div class="times"><span id="t0">00:00</span><span id="t1">00:00</span></div>
    <audio id="audio" preload="auto"></audio>
    <div class="controls">
      <button id="btn-start">点击开始播放（若被浏览器拦截）</button>
      <button class="ghost" id="btn-pause">暂停</button>
      <label class="volume-ctl">音量
        <input id="volume" type="range" min="0" max="100" value="80" />
        <span id="volume-val">80%</span>
      </label>
    </div>
    <p class="hint" id="hint">等待歌曲加入队列。</p>
  </div>
  <script src="/static/js/common.js?v=31"></script>
  <script src="/static/js/player.js?v=31"></script>
</body>
</html>
